<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Sense6 offers short, careful browser perception tests with honest, screen-relative results. No account and no answers or results uploaded."
    />
    <meta property="og:title" content="Sense6 — measure what your senses notice" />
    <meta
      property="og:description"
      content="Private browser tests for colour, response timing, hearing, and calibrated visual detail. Answers and results stay in your browser."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://sense6.net/" />
    <meta property="og:image" content="https://sense6.net/social/sense6.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Sense6 browser perception experiments" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Sense6 — measure what your senses notice" />
    <meta
      name="twitter:description"
      content="Private browser tests for colour, response timing, hearing, and calibrated visual detail. Answers and results stay in your browser."
    />
    <meta name="twitter:image" content="https://sense6.net/social/sense6.png" />
    <meta name="twitter:image:alt" content="Sense6 browser perception experiments" />
    <meta name="theme-color" content="#f4f4f2" />
    <link rel="canonical" href="https://sense6.net/" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Sense6 — measure what your senses notice</title>
    <script>
      try {
        var theme = localStorage.getItem('bronto-theme');
        if (theme) document.documentElement.dataset.theme = theme;
      } catch (error) {}
    </script>
  </head>
  <body>
    <a class="ui-skiplink" href="#main" data-i18n-source="Skip to content">Skip to content</a>

    <header class="site-chrome">
      <div class="ui-container ui-container--wide">
        <div class="ui-siteheader">
          <a class="ui-siteheader__brand brand" data-sense6-route="" href="/en/" aria-label="Sense6 — all tests" data-i18n-aria-label="Sense6 — all tests"
            >Sense<span class="brand__six">6</span></a
          >
          <div class="ui-siteheader__actions">
            <span class="device-chip" id="gamut-chip" aria-live="polite" data-i18n-source="Checking display…">Checking display…</span>
            <label class="locale-picker">
              <span class="sr-only" data-i18n-source="Language">Language</span>
              <select data-locale-select aria-label="Language" data-i18n-aria-label="Language"></select>
            </label>
            <button
              class="ui-button ui-button--ghost ui-button--sm theme-button"
              type="button"
              data-bronto-theme-toggle
              aria-label="Toggle light and dark theme"
              data-i18n-aria-label="Toggle light and dark theme"
            >
              <span aria-hidden="true">◐</span>
              <span class="theme-button__label" data-i18n-source="Theme">Theme</span>
            </button>
          </div>
        </div>
      </div>
    </header>

    <main id="main" tabindex="-1">
      <div id="app"></div>
    </main>

    <footer class="ui-container ui-container--wide ui-sitefooter">
      <p>Sense6 <span aria-hidden="true">·</span> <span data-i18n-source="Measure carefully. Keep it private.">Measure carefully. Keep it private.</span></p>
      <div class="ui-sitefooter__links">
        <a data-sense6-route="learn" data-sense6-english-only href="/en/learn/" lang="en">Learn</a>
        <a data-sense6-route="about" href="/en/about/" data-i18n-source="About">About</a>
        <a data-sense6-route="journal" href="/en/journal/" data-i18n-source="Journal">Journal</a>
        <a data-sense6-route="privacy" href="/en/privacy/" data-i18n-source="Privacy">Privacy</a>
        <a data-sense6-route="" href="/en/" data-i18n-source="All tests">All tests</a>
      </div>
    </footer>

    <div class="sr-only" id="announcer" aria-live="polite" aria-atomic="true"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
