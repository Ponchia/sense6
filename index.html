<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Sensoria is a collection of honest, browser-based perception tests: colour discrimination, an Ishihara-style colour-blindness screen, and more. No accounts, nothing uploaded."
    />
    <meta property="og:title" content="Sensoria — honest browser perception tests" />
    <meta
      property="og:description"
      content="Careful, self-scoring perception tests: colour discrimination and an Ishihara-style colour-blindness screen. Screen-relative, never a diagnosis."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://tetracromia.brontolotto.observer/" />
    <meta name="twitter:card" content="summary" />
    <meta name="theme-color" content="#f4f4f2" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='8' fill='%23111111'/%3E%3Ccircle cx='20' cy='20' r='8' fill='%23ff4250'/%3E%3Ccircle cx='44' cy='20' r='8' fill='%23ffd34e'/%3E%3Ccircle cx='20' cy='44' r='8' fill='%233bd6a2'/%3E%3Ccircle cx='44' cy='44' r='8' fill='%235c75ff'/%3E%3C/svg%3E" />
    <title>Sensoria — honest browser perception tests</title>
    <script>
      try {
        var theme = localStorage.getItem('bronto-theme');
        if (theme) document.documentElement.dataset.theme = theme;
      } catch (error) {}
    </script>
  </head>
  <body>
    <a class="ui-skiplink" href="#main">Skip to content</a>

    <header class="site-chrome">
      <div class="ui-container ui-container--wide">
        <div class="ui-siteheader">
          <a class="ui-siteheader__brand brand" href="#/" aria-label="Sensoria — all tests">
            Sensoria
          </a>
          <div class="ui-siteheader__actions">
            <span class="device-chip" id="gamut-chip" aria-live="polite">Checking display…</span>
            <button
              class="ui-button ui-button--ghost ui-button--sm theme-button"
              type="button"
              data-bronto-theme-toggle
              aria-label="Toggle light and dark theme"
            >
              <span aria-hidden="true">◐</span>
              <span class="theme-button__label">Theme</span>
            </button>
          </div>
        </div>
      </div>
    </header>

    <main id="main" tabindex="-1">
      <div id="app"></div>
    </main>

    <footer class="ui-container ui-container--wide ui-sitefooter">
      <p>Sensoria <span aria-hidden="true">·</span> Honest, screen-based perception tests.</p>
      <div class="ui-sitefooter__links">
        <a href="#/">All tests</a>
        <a href="https://github.com/Ponchia/tetracromia" rel="noreferrer">Source</a>
      </div>
    </footer>

    <div class="sr-only" id="announcer" aria-live="polite" aria-atomic="true"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
