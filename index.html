<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Sense6 offers short, careful browser perception tests with honest, screen-relative results. No account and no answers or results uploaded."
    />
    <meta property="og:title" content="Sense6 — measure what your senses notice" />
    <meta
      property="og:description"
      content="Private browser tests for colour, response timing, and hearing. Answers and results stay in your browser."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://sense6.net/" />
    <meta name="twitter:card" content="summary" />
    <meta name="theme-color" content="#f4f4f2" />
    <link rel="canonical" href="https://sense6.net/" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='8' fill='%23111111'/%3E%3Cg stroke='%23f4f4f2' stroke-width='2'%3E%3Cpath d='M32 32V10M32 32L51 21M32 32L51 43M32 32V54M32 32L13 43M32 32L13 21'/%3E%3Ccircle cx='32' cy='10' r='4' fill='%23ff4250'/%3E%3Ccircle cx='51' cy='21' r='4' fill='%23f08a32'/%3E%3Ccircle cx='51' cy='43' r='4' fill='%238fbd3f'/%3E%3Ccircle cx='32' cy='54' r='4' fill='%2334bdaa'/%3E%3Ccircle cx='13' cy='43' r='4' fill='%234b8fe2'/%3E%3Ccircle cx='13' cy='21' r='4' fill='%23966bd1'/%3E%3C/g%3E%3Crect x='24' y='24' width='16' height='16' transform='rotate(45 32 32)' fill='%23f4f4f2'/%3E%3C/svg%3E" />
    <title>Sense6 — measure what your senses notice</title>
    <script>
      try {
        var theme = localStorage.getItem('bronto-theme');
        if (theme) document.documentElement.dataset.theme = theme;
      } catch (error) {}
    </script>
  </head>
  <body>
    <a class="ui-skiplink" href="#main">Skip to content</a>

    <header class="site-chrome">
      <div class="ui-container ui-container--wide">
        <div class="ui-siteheader">
          <a class="ui-siteheader__brand brand" href="#/" aria-label="Sense6 — all tests"
            >Sense<span class="brand__six">6</span></a
          >
          <div class="ui-siteheader__actions">
            <span class="device-chip" id="gamut-chip" aria-live="polite">Checking display…</span>
            <label class="locale-picker">
              <span class="sr-only">Language</span>
              <select data-locale-select aria-label="Language"></select>
            </label>
            <button
              class="ui-button ui-button--ghost ui-button--sm theme-button"
              type="button"
              data-bronto-theme-toggle
              aria-label="Toggle light and dark theme"
            >
              <span aria-hidden="true">◐</span>
              <span class="theme-button__label">Theme</span>
            </button>
          </div>
        </div>
      </div>
    </header>

    <main id="main" tabindex="-1">
      <div id="app"></div>
    </main>

    <footer class="ui-container ui-container--wide ui-sitefooter">
      <p>Sense6 <span aria-hidden="true">·</span> Measure carefully. Keep it private.</p>
      <div class="ui-sitefooter__links">
        <span>Anonymous daily counts · no cookies</span>
        <a href="#/">All tests</a>
      </div>
    </footer>

    <div class="sr-only" id="announcer" aria-live="polite" aria-atomic="true"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
