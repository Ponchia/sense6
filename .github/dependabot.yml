version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:15"
      timezone: Europe/Zurich
    open-pull-requests-limit: 5
    versioning-strategy: increase-if-necessary
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm-non-major:
        patterns:
          - '*'
        # Playwright must advance alongside the digest-pinned CI browser image.
        # Give it a dedicated PR instead of breaking an unrelated dependency batch.
        exclude-patterns:
          - '@playwright/test'
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:30"
      timezone: Europe/Zurich
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(actions)"
    groups:
      actions-non-major:
        update-types:
          - minor
          - patch
