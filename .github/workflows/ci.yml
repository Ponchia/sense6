name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fork and same-repository pull requests share the hosted verification graph.
  # Internal ARC registration was retired before public launch. A contributor
  # can change workflow source, so runner isolation remains an external control.
  # See docs/public-repository-readiness.md for ongoing maintenance checks.
  verify:
    uses: ./.github/workflows/verify.yml
