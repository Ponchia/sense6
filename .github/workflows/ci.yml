name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The current private-repository workflow accepts same-repository PRs only.
  # Keep this regression guard, but do not treat mutable workflow code as the
  # public security boundary: a fork can propose changes to this file. Before
  # making the repository public, enforce runner access outside PR-controlled
  # code and provide an isolated/hosted path for untrusted contributions.
  # See docs/public-repository-readiness.md.
  verify:
    if: github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/verify.yml
