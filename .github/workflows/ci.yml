name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # `runs-on: arc-vps-sense6` is a self-hosted runner inside the operator's
  # netcup cluster. This repository is private today, so only trusted pull
  # requests reach it — but branch protection is impossible without GitHub Pro,
  # and "make the repository public" is the obvious remedy. Making it public
  # without this guard would hand every fork pull request code execution in the
  # cluster. The guard is defensive and must survive any visibility change.
  verify:
    if: github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/verify.yml
