name: CI

on:
  pull_request:

permissions:
  contents: read
  deployments: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install browser engines
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run unit, build, browser, responsive, and accessibility checks
        run: timeout --verbose --signal=TERM --kill-after=30s 10m npm run check

      - name: Publish the verified preview
        if: github.event.pull_request.head.repo.full_name == github.repository
        id: preview
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: 4.112.0
          command: pages deploy dist --project-name=sense6 --branch=pr-${{ github.event.pull_request.number }} --commit-hash=${{ github.event.pull_request.head.sha }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Smoke-test the real preview
        if: github.event.pull_request.head.repo.full_name == github.repository
        run: node scripts/smoke-preview.mjs "${{ steps.preview.outputs.deployment-url }}"
