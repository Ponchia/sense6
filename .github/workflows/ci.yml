name: CI

on:
  pull_request:

permissions:
  contents: read
  deployments: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    uses: ./.github/workflows/verify.yml
    with:
      deploy_target: ${{ github.event.pull_request.head.repo.full_name == github.repository && 'preview' || 'none' }}
      deploy_branch: pr-${{ github.event.pull_request.number }}
    secrets: inherit
