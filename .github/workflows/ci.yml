name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fork and same-repository pull requests share the hosted verification graph.
  # Before public launch, retire this repository's internal ARC registration;
  # a contributor can change workflow source, so runner isolation is external.
  # See docs/public-repository-readiness.md for the coordinated cutover.
  verify:
    uses: ./.github/workflows/verify.yml
