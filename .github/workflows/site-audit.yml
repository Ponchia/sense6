name: Site audit

on:
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * 1'

permissions:
  contents: read

concurrency:
  group: site-audit-${{ github.ref }}
  cancel-in-progress: true

# Browser-container jobs use the Node 24 runtime bundled with the pinned
# Playwright image, avoiding a redundant download on every ephemeral runner.
#
# This workflow owns the expensive whole-site and external-production sweeps.
# Pull requests and pushes use verify.yml instead, so their visual, browser,
# Lighthouse, and release gates form one dependency graph rather than racing a
# second workflow for the same runner scale set.
jobs:
  route-integrity:
    runs-on: arc-vps-sense6
    timeout-minutes: 20
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble@sha256:5b8f294aff9041b7191c34a4bab3ac270157a28774d4b0660e9743297b697e48
    steps:
      - name: Check out the repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install dependencies
        run: npm ci
      - name: Build the static site
        run: npm run build
      - name: Validate all generated HTML
        run: npm run test:html
      - name: Validate internal links and fragments
        run: npm run test:links
      - name: Crawl every canonical route
        run: npm run test:site-integrity
      - name: Upload the browser report on failure
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-audit-playwright-report
          path: playwright-report/site-audit
          if-no-files-found: ignore
          retention-days: 3

  # The pull request and push Lighthouse budget now runs inside verify.yml, where
  # the release job needs it and a budget failure can actually stop a deploy.
  # What remains here is the scheduled full-site sweep over every route.
  lighthouse-full-site:
    runs-on: arc-vps-sense6
    # The full indexable set grew from 85 to 157 routes as Learn was published
    # across 12 languages. The old 45-minute ceiling was too close to the
    # projected serial mobile Lighthouse runtime; keep every route in scope.
    timeout-minutes: 65
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble@sha256:5b8f294aff9041b7191c34a4bab3ac270157a28774d4b0660e9743297b697e48
    env:
      FULL_SITE_AUDIT: '1'
      UNLIGHTHOUSE_OUTPUT_PATH: .unlighthouse
      UNLIGHTHOUSE_SITE: http://127.0.0.1:4174
    steps:
      - name: Check out the repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install dependencies
        run: npm ci
      - name: Build and serve the static site
        run: |
          npm run build
          npm run preview -- --port 4174 --strictPort > /tmp/sense6-preview.log 2>&1 &
          node scripts/wait-for-url.mjs http://127.0.0.1:4174/sitemap.xml
      - name: Enforce Lighthouse budgets
        run: npm run audit:lighthouse
      - name: Upload Lighthouse results
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unlighthouse-full-site-report
          path: .unlighthouse
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 3

  external-links:
    runs-on: arc-vps-sense6
    timeout-minutes: 15
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - name: Check out the repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci
      - name: Build the static site
        run: npm run build
      - name: Check external links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --root-dir dist --exclude '^https://sense6\\.net' --max-concurrency 4
            --host-concurrency 2 --timeout 30 --max-retries 5 --retry-wait-time 3
            --no-progress 'dist/**/*.html'
          fail: true
          failIfEmpty: true
          jobSummary: true
          lycheeVersion: v0.24.2

  passive-security:
    runs-on: arc-vps-sense6
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Prepare the reviewed passive-scan rules
        run: |
          install -d -m 0777 "$RUNNER_TEMP/zap"
          install -m 0644 .zap-rules.tsv "$RUNNER_TEMP/zap/.zap-rules.tsv"
      - name: Run the passive ZAP baseline against production
        run: >-
          docker run --rm
          --volume "$RUNNER_TEMP/zap:/zap/wrk/:rw"
          ghcr.io/zaproxy/zaproxy:stable@sha256:8d387b1a63e3425beef4846e39719f5af2a787753af2d8b6558c6257d7a577a2
          zap-baseline.py
          -t https://sense6.net
          -c .zap-rules.tsv
          -s
