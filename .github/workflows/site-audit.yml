name: Site audit

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * 1'

permissions:
  contents: read

concurrency:
  group: site-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Browser-container jobs use the Node 24 runtime bundled with the pinned
# Playwright image, avoiding a redundant download on every ephemeral runner.
jobs:
  route-integrity:
    runs-on: arc-vps-sense6
    timeout-minutes: 20
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble@sha256:5b8f294aff9041b7191c34a4bab3ac270157a28774d4b0660e9743297b697e48
    steps:
      - name: Check out the repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install dependencies
        run: npm ci
      - name: Build the static site
        run: npm run build
      - name: Validate all generated HTML
        run: npm run test:html
      - name: Validate internal links and fragments
        run: npm run test:links
      - name: Crawl every canonical route
        run: npm run test:site-integrity
      - name: Upload the browser report on failure
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: site-audit-playwright-report
          path: playwright-report/site-audit
          if-no-files-found: ignore
          retention-days: 3

  visual-regression:
    if: github.event_name == 'pull_request'
    runs-on: arc-vps-sense6
    timeout-minutes: 15
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble@sha256:5b8f294aff9041b7191c34a4bab3ac270157a28774d4b0660e9743297b697e48
    steps:
      - name: Check out the repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Install dependencies
        run: npm ci
      - name: Record intentional visual baseline updates
        id: visual-baselines
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          approved="$(git diff --name-only "$BASE_SHA" HEAD -- audits/visual-regression.spec.js-snapshots \
            | sed 's#^audits/visual-regression.spec.js-snapshots/##' \
            | paste -sd, -)"
          echo "approved=$approved" >> "$GITHUB_OUTPUT"
      - name: Check out and build the base revision
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BASE_WORKTREE: ${{ runner.temp }}/sense6-visual-base
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git worktree add --detach "$BASE_WORKTREE" "$BASE_SHA"
          npm ci --prefix "$BASE_WORKTREE"
          npm run build --prefix "$BASE_WORKTREE"
      - name: Capture base revision on this runner
        env:
          HOME: /root
          PLAYWRIGHT_SITE_DIR: ${{ runner.temp }}/sense6-visual-base
          VISUAL_BASELINE_CAPTURE: '1'
        run: npm run test:visual:container -- --update-snapshots
      - name: Build the candidate revision
        run: npm run build
      - name: Compare the candidate with the base revision
        env:
          HOME: /root
          VISUAL_APPROVED_SNAPSHOTS: ${{ steps.visual-baselines.outputs.approved }}
        run: npm run test:visual:container
      - name: Upload the browser report on failure
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: visual-regression-playwright-report
          path: playwright-report/site-audit
          if-no-files-found: ignore
          retention-days: 3

  lighthouse:
    runs-on: arc-vps-sense6
    timeout-minutes: 45
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble@sha256:5b8f294aff9041b7191c34a4bab3ac270157a28774d4b0660e9743297b697e48
    env:
      FULL_SITE_AUDIT: ${{ github.event_name != 'pull_request' && '1' || '0' }}
      UNLIGHTHOUSE_OUTPUT_PATH: .unlighthouse
      UNLIGHTHOUSE_SITE: http://127.0.0.1:4174
    steps:
      - name: Check out the repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install dependencies
        run: npm ci
      - name: Build and serve the static site
        run: |
          npm run build
          npm run preview -- --port 4174 --strictPort > /tmp/sense6-preview.log 2>&1 &
          node scripts/wait-for-url.mjs http://127.0.0.1:4174/sitemap.xml
      - name: Enforce Lighthouse budgets
        run: npm run audit:lighthouse
      - name: Upload Lighthouse results
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unlighthouse-report
          path: .unlighthouse
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 3

  external-links:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: arc-vps-sense6
    timeout-minutes: 15
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - name: Check out the repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci
      - name: Build the static site
        run: npm run build
      - name: Check external links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --root-dir dist --exclude '^https://sense6\\.net' --max-concurrency 8
            --timeout 30 --max-retries 2 --no-progress 'dist/**/*.html'
          fail: true
          failIfEmpty: true
          jobSummary: true
          lycheeVersion: v0.24.2

  passive-security:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: arc-vps-sense6
    timeout-minutes: 15
    steps:
      - name: Run the passive ZAP baseline against production
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: https://sense6.net
          allow_issue_writing: false
          fail_action: true
