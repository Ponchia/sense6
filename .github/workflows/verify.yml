name: Verify Sense6

on:
  workflow_call:
    inputs:
      publish_production:
        description: Publish the verified working tree to the production branch.
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  deployments: write

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: chromium
            engine: chromium
          - project: mobile
            engine: chromium
          - project: chromium-smoke
            engine: chromium
          - project: firefox
            engine: firefox
          - project: webkit
            engine: webkit

    steps:
      - name: Check out the repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install ${{ matrix.engine }}
        run: npx playwright install --with-deps ${{ matrix.engine }}

      - name: Verify the ${{ matrix.project }} project
        run: npx playwright test --project=${{ matrix.project }}

  release:
    needs: browser
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify code and build the production artifact
        run: npm run check:core

      - name: Validate generated HTML and links
        run: |
          npm run test:html
          npm run test:links

      - name: Stamp and checksum the verified artifact
        run: |
          node scripts/write-build-metadata.mjs "$GITHUB_SHA"
          find dist -type f -print0 | sort -z | xargs -0 sha256sum > dist.sha256

      - name: Verify the artifact checksum
        run: sha256sum --check dist.sha256

      - name: Audit the production artifact
        run: npm run test:site-audit

      - name: Publish the verified production bundle
        if: inputs.publish_production
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: 4.112.0
          command: pages deploy dist --project-name=sense6 --branch=main --commit-hash=${{ github.sha }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify the live production commit and contract
        if: inputs.publish_production
        run: node scripts/smoke-production.mjs https://sense6.net "${{ github.sha }}"

      - name: Verify the deployed JavaScript journey
        if: inputs.publish_production
        env:
          PLAYWRIGHT_DEPLOYED_URL: https://sense6.net
        run: npm run test:deployed

      - name: Preserve deployed-browser failure artifacts
        if: always() && inputs.publish_production
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: deployed-browser-report
          path: |
            playwright-report/deployed
            test-results/deployed
          if-no-files-found: ignore
