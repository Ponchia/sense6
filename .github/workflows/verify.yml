name: Verify Sense6

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify code and build the production artifact
        run: npm run check:core

      - name: Validate generated HTML and links
        run: |
          npm run test:html
          npm run test:links

      - name: Stamp and checksum the verified artifact
        run: |
          node scripts/write-build-metadata.mjs "$GITHUB_SHA"
          find dist -type f -print0 | sort -z | xargs -0 sha256sum > dist.sha256

      - name: Upload the verified artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-dist-${{ github.sha }}
          path: |
            dist
            dist.sha256
          if-no-files-found: error
          retention-days: 7

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: chromium
            engine: chromium
          - project: mobile
            engine: chromium
          - project: chromium-smoke
            engine: chromium
          - project: firefox
            engine: firefox
          - project: webkit
            engine: webkit

    steps:
      - name: Check out the repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install ${{ matrix.engine }}
        run: npx playwright install --with-deps ${{ matrix.engine }}

      - name: Verify the ${{ matrix.project }} project
        run: npx playwright test --project=${{ matrix.project }}

  production-artifact:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out audit scripts
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Download the verified artifact
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: verified-dist-${{ github.sha }}

      - name: Verify the artifact checksum
        run: sha256sum --check dist.sha256

      - name: Audit the production artifact
        run: npm run test:site-audit
