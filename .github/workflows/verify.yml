name: Verify Sense6

on:
  workflow_call:
    inputs:
      publish_production:
        description: Publish the verified working tree to the production branch.
        required: false
        default: false
        type: boolean

# Token capabilities are inherited from the explicit caller policy: CI grants
# read-only contents access, while the production workflow additionally grants
# deployment access.

# Container jobs use the Node 24 runtime bundled with the pinned Playwright
# image, avoiding a redundant network download on every ephemeral runner.
env:
  PUPPETEER_SKIP_DOWNLOAD: 'true'

jobs:
  browser:
    runs-on: arc-vps-sense6
    timeout-minutes: 40
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble@sha256:5b8f294aff9041b7191c34a4bab3ac270157a28774d4b0660e9743297b697e48

    steps:
      - name: Check out the repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install dependencies
        run: npm ci

      # The browser matrix runs against `dist` served by
      # scripts/serve-deployed-smoke.mjs, so every project loads the
      # pre-rendered static pages and the production bundle under an enforced
      # Content-Security-Policy. See the webServer comment in
      # playwright.config.js for why the Vite dev server was not a valid target.
      - name: Verify every browser project
        env:
          HOME: /root
        run: >-
          npx playwright test
          --project=chromium
          --project=mobile
          --project=chromium-smoke
          --project=firefox
          --project=webkit
          --workers=1

  # Lighthouse budgets (performance 90, accessibility 100, SEO 100) used to live
  # only in site-audit.yml, which has no `needs` or `workflow_run` relation to
  # deploy.yml — so a budget failure could not stop a deploy and the two merely
  # raced. Gating the release job on this makes the budget an actual gate.
  lighthouse:
    runs-on: arc-vps-sense6
    timeout-minutes: 45
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble@sha256:5b8f294aff9041b7191c34a4bab3ac270157a28774d4b0660e9743297b697e48
    env:
      FULL_SITE_AUDIT: '0'
      UNLIGHTHOUSE_OUTPUT_PATH: .unlighthouse
      UNLIGHTHOUSE_SITE: http://127.0.0.1:4174
    steps:
      - name: Check out the repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install dependencies
        run: npm ci
      - name: Build and serve the static site
        run: |
          npm run build
          npm run preview -- --port 4174 --strictPort > /tmp/sense6-preview.log 2>&1 &
          node scripts/wait-for-url.mjs http://127.0.0.1:4174/sitemap.xml
      - name: Enforce Lighthouse budgets
        run: npm run audit:lighthouse
      - name: Upload Lighthouse results
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unlighthouse-report
          path: .unlighthouse
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 3

  # Keep the visual comparison in the same reusable graph as release. It used
  # to run in site-audit.yml, where a push started a second workflow that raced
  # this one and could not stop publication even if the comparison failed.
  visual:
    runs-on: arc-vps-sense6
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble@sha256:5b8f294aff9041b7191c34a4bab3ac270157a28774d4b0660e9743297b697e48
    steps:
      - name: Check out the repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Install dependencies
        run: npm ci
      - name: Resolve the revision to compare against
        id: base
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          base="$PR_BASE_SHA"
          if [ -z "$base" ]; then base="$PUSH_BEFORE_SHA"; fi
          # A manual run, new branch, or force push may not provide a usable
          # base. Fall back to the first parent so the comparison stays real.
          case "$base" in
            ''|0000000000000000000000000000000000000000) base="$(git rev-parse HEAD^)" ;;
          esac
          if ! git cat-file -e "$base^{commit}" 2>/dev/null; then base="$(git rev-parse HEAD^)"; fi
          echo "sha=$base" >> "$GITHUB_OUTPUT"
          echo "Comparing against $base"
      - name: Read the declared visual baseline approvals
        id: visual-baselines
        run: |
          approved="$(sed -e 's/#.*//' -e 's/[[:space:]]//g' audits/visual-baseline-approvals.txt \
            | grep -v '^$' | paste -sd, - || true)"
          echo "approved=$approved" >> "$GITHUB_OUTPUT"
          echo "Approved baselines: ${approved:-<none>}"
      - name: Check out and build the base revision
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
          BASE_WORKTREE: ${{ runner.temp }}/sense6-visual-base
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git worktree add --detach "$BASE_WORKTREE" "$BASE_SHA"
          npm ci --prefix "$BASE_WORKTREE"
          npm run build --prefix "$BASE_WORKTREE"
      - name: Capture base revision on this runner
        env:
          HOME: /root
          PLAYWRIGHT_SITE_DIR: ${{ runner.temp }}/sense6-visual-base
          VISUAL_BASE_SITE_DIR: ${{ runner.temp }}/sense6-visual-base
          VISUAL_BASELINE_CAPTURE: '1'
        run: npm run test:visual:container -- --update-snapshots
      - name: Build the candidate revision
        run: npm run build
      - name: Compare the candidate with the base revision
        env:
          HOME: /root
          VISUAL_APPROVED_SNAPSHOTS: ${{ steps.visual-baselines.outputs.approved }}
          VISUAL_BASE_SITE_DIR: ${{ runner.temp }}/sense6-visual-base
        run: npm run test:visual:container
      - name: Upload the visual comparison report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: visual-regression-playwright-report
          path: playwright-report/site-audit
          if-no-files-found: ignore
          retention-days: 14

  release:
    needs: [browser, lighthouse, visual]
    runs-on: arc-vps-sense6
    timeout-minutes: 40
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble@sha256:5b8f294aff9041b7191c34a4bab3ac270157a28774d4b0660e9743297b697e48

    steps:
      - name: Check out the repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install dependencies
        run: npm ci

      - name: Verify code and build the production artifact
        run: npm run check:core

      # The checksum is taken here, at the first moment `dist` exists, and is
      # re-checked in the last step before the upload. Everything in between —
      # HTML and link validation, the local browser journey, the production-site
      # audit — therefore runs against bytes that are provably the bytes being
      # published. Taking it later would shrink the attested window; taking it
      # immediately before the re-check, as this job used to, would close the
      # window entirely and make the comparison a tautology.
      - name: Stamp and checksum the verified artifact
        run: |
          node scripts/write-build-metadata.mjs "$GITHUB_SHA"
          find dist -type f -print0 | sort -z | xargs -0 sha256sum > dist.sha256

      - name: Validate generated HTML and links
        run: |
          npm run test:html
          npm run test:links

      # tests/deployed/deployed.spec.js holds the only browser-enforced CSP and
      # hydration assertions in the repository, and it used to run exclusively
      # after a production publish — never on a pull request, and never before
      # traffic already had the build. With PLAYWRIGHT_DEPLOYED_URL unset,
      # playwright.deployed.config.js starts scripts/serve-deployed-smoke.mjs
      # over the artifact built above, replaying dist/_headers so the policy is
      # genuinely enforced. This runs for every caller, and a failure stops the
      # job before anything is published.
      - name: Verify the JavaScript journey against the local artifact
        env:
          HOME: /root
        run: npm run test:deployed

      - name: Audit the production artifact
        run: npm run test:site-audit

      # Real verification steps run between the stamp above and this check, and
      # this check is the last thing before the upload, so a pass attests that
      # the audited bytes and the published bytes are the same bytes. Moving the
      # stamp down next to this step, or inserting any step between this check
      # and the upload, removes that guarantee; tests/audit-wiring.test.js pins
      # both halves of the ordering.
      - name: Verify the artifact is unchanged since it was checksummed
        run: sha256sum --check dist.sha256

      - name: Publish the verified production bundle
        if: inputs.publish_production
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: 4.112.0
          command: pages deploy dist --project-name=sense6 --branch=main --commit-hash=${{ github.sha }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      # smoke-production.mjs waits until the edge serves every hashed file this
      # build produced — each pre-rendered page referencing its own chunks, plus
      # the chunks no page names — on three consecutive sweeps before returning.
      # Waiting on the entry chunk alone was not enough: a change confined to a
      # route chunk leaves the entry hash untouched, so the wait returned
      # immediately while the edge still served the previous deployment. The
      # journey below therefore no longer races Cloudflare propagation, and a red
      # result means a real regression rather than an unsettled edge.
      - name: Verify the live production commit and contract
        if: inputs.publish_production
        run: node scripts/smoke-production.mjs https://sense6.net "${{ github.sha }}"

      - name: Verify the deployed JavaScript journey
        if: inputs.publish_production
        env:
          PLAYWRIGHT_DEPLOYED_URL: https://sense6.net
        run: npm run test:deployed

      - name: Preserve deployed-browser failure artifacts
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: deployed-browser-report
          path: |
            playwright-report/deployed
            test-results/deployed
          if-no-files-found: ignore
          retention-days: 3
