name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify the production bundle
        run: npm run check

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and publish the immutable image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64
          build-args: |
            VCS_REF=${{ github.sha }}
          tags: |
            ghcr.io/ponchia/tetracromia:latest
            ghcr.io/ponchia/tetracromia:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/Ponchia/tetracromia
          cache-from: type=gha,scope=tetracromia
          cache-to: type=gha,mode=max,scope=tetracromia
          provenance: true
          sbom: true

      - name: Check out the GitOps repository
        uses: actions/checkout@v6
        with:
          repository: Ponchia/vps-infra
          ref: main
          path: vps-infra
          ssh-key: ${{ secrets.VPS_INFRA_GITOPS_SSH_KEY }}
          fetch-depth: 0

      - name: Update the desired image in GitOps
        run: |
          set -euo pipefail
          cd vps-infra
          git pull --rebase origin main
          python3 scripts/gitops_set_image_tag.py \
            --file deployments/tetricromia/kustomization.yaml \
            --image ghcr.io/ponchia/tetracromia \
            --tag "${GITHUB_SHA}"

          if git diff --quiet -- deployments/tetricromia/kustomization.yaml; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deployments/tetricromia/kustomization.yaml
          git commit -m "chore(gitops): deploy tetracromia ${GITHUB_SHA}"

          pushed=false
          for _ in 1 2 3; do
            if git push origin HEAD:main; then
              pushed=true
              break
            fi
            git pull --rebase origin main
            sleep 5
          done

          if [ "$pushed" != "true" ]; then
            echo "failed to push the tetracromia image update" >&2
            exit 1
          fi
