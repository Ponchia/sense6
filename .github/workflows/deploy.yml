name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write

jobs:
  verify:
    uses: ./.github/workflows/verify.yml
    with:
      deploy_target: production
      deploy_branch: main
    secrets: inherit
